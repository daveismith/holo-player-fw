[pytest]
# The tests are coroutines on one event loop for the session, which the pycyphal node lives on.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
# No .pytest_cache in the tree; -v and short tracebacks for a bench run.
addopts = -v --tb=short -p no:cacheprovider
markers =
    restarts: restarts the Cyphal node or the board
    slow: takes minutes
    ota: uploads firmware to the spare OTA slot over Wi-Fi (never activated)
filterwarnings =
    ignore::DeprecationWarning:nunavut.*
    ignore::DeprecationWarning:pydsdl.*
