<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Holo Player</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23673ab7'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23ffc107'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/app.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <header class="top">
    <a class="brand" href="#/status"><span class="logo" aria-hidden="true"></span><span id="name">Holo Player</span></a>
    <span id="link" class="chip" hidden></span>
  </header>
  <nav id="nav" class="nav" aria-label="Pages"></nav>
  <div id="banners" class="banners"></div>
  <main id="page" class="page" tabindex="-1">
    <p class="muted">Loading…</p>
  </main>
  <noscript><p class="page">This page needs JavaScript.</p></noscript>
  <dialog id="auth" class="dialog">
    <form method="dialog">
      <h2>Password</h2>
      <p>Changes need the board's web password (set on its console with <code>web password</code>).</p>
      <input name="password" type="password" autocomplete="current-password" required minlength="4" aria-label="Password">
      <p class="error" hidden></p>
      <div class="actions">
        <button value="cancel" formnovalidate class="button">Cancel</button>
        <button value="ok" class="button primary">Continue</button>
      </div>
    </form>
  </dialog>
</body>
</html>
